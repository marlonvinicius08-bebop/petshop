worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream gateway { server api-gateway:3000; }
    upstream web_publica { server web-publica:8080; }
    upstream web_cliente { server web-cliente:8080; }
    upstream web_gestao { server web-gestao:8080; }

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /cliente/ {
            proxy_pass http://web_cliente/;
        }

        location /gestao/ {
            proxy_pass http://web_gestao/;
        }

        location / {
            proxy_pass http://web_publica;
        }
    }
}
